services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinsight
      POSTGRES_USER: clinsight
      POSTGRES_PASSWORD: clinsight
    ports:
      - "5432:5432"
    volumes:
      - clinsight_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinsight -d clinsight"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://clinsight:clinsight@db:5432/clinsight
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      INTERNAL_API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  generate-hospital-data:
    build:
      context: ./backend
    profiles:
      - tools
    environment:
      DATABASE_URL: postgresql+psycopg2://clinsight:clinsight@db:5432/clinsight
      HOSPITAL_PATIENTS: ${HOSPITAL_PATIENTS:-1000}
      HOSPITAL_SEED: ${HOSPITAL_SEED:-42}
      HOSPITAL_BATCH_ID: ${PIPELINE_BATCH_ID:-synthetic-42-1000}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      python scripts/generate_hospital_data.py
      --patients $$HOSPITAL_PATIENTS
      --seed $$HOSPITAL_SEED
      --ingestion-batch-id $$HOSPITAL_BATCH_ID"

  dbt-run:
    build:
      context: ./dbt
    profiles:
      - tools
    environment:
      CLINSIGHT_DBT_HOST: db
      CLINSIGHT_DBT_PORT: "5432"
      CLINSIGHT_DBT_USER: clinsight
      CLINSIGHT_DBT_PASSWORD: clinsight
      CLINSIGHT_DBT_DBNAME: clinsight
      CLINSIGHT_DBT_SCHEMA: analytics
      DBT_SELECT: ${DBT_SELECT:-staging marts.clinical}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "cp profiles.example.yml profiles.yml &&
      dbt run --profiles-dir . --select $$DBT_SELECT &&
      dbt test --profiles-dir . --select $$DBT_SELECT"

  generate-fhir:
    build:
      context: ./backend
    profiles:
      - tools
    environment:
      DATABASE_URL: postgresql+psycopg2://clinsight:clinsight@db:5432/clinsight
      CLINICAL_SCHEMA: analytics_clinical
      FHIR_LIMIT: ${FHIR_LIMIT:-50}
      FHIR_BATCH_ID: ${PIPELINE_BATCH_ID:-synthetic-42-1000}
      FHIR_OUTPUT_DIR: ${FHIR_OUTPUT_DIR:-/app/data/generated_fhir_bundles}
    volumes:
      - ./backend/data/generated_fhir_bundles:/app/data/generated_fhir_bundles
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      python scripts/generate_fhir_bundles.py
      --limit $$FHIR_LIMIT
      --output $$FHIR_OUTPUT_DIR
      --ingestion-batch-id $$FHIR_BATCH_ID"

  backend-tests:
    build:
      context: ./backend
    profiles:
      - tools
    command: python -m pytest

  seed:
    build:
      context: ./backend
    profiles:
      - tools
    environment:
      DATABASE_URL: postgresql+psycopg2://clinsight:clinsight@db:5432/clinsight
      RESET_DEMO_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python scripts/seed_demo_data.py"

  metrics:
    build:
      context: ./backend
    profiles:
      - tools
    environment:
      DATABASE_URL: postgresql+psycopg2://clinsight:clinsight@db:5432/clinsight
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python scripts/measure_demo_metrics.py"

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    profiles:
      - airflow
    environment:
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      DATABASE_URL: postgresql+psycopg2://clinsight:clinsight@db:5432/clinsight
      CLINICAL_SCHEMA: analytics_clinical
      CLINSIGHT_DBT_HOST: db
      CLINSIGHT_DBT_PORT: "5432"
      CLINSIGHT_DBT_USER: clinsight
      CLINSIGHT_DBT_PASSWORD: clinsight
      CLINSIGHT_DBT_DBNAME: clinsight
      CLINSIGHT_DBT_SCHEMA: analytics
      DBT_SELECT: ${DBT_SELECT:-staging marts.clinical}
    ports:
      - "8080:8080"
    volumes:
      - clinsight_airflow:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags:ro
    depends_on:
      db:
        condition: service_healthy
    command: standalone

volumes:
  clinsight_postgres:
  clinsight_airflow:
